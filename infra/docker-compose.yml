services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crossledger-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CrossLedger_Dev#2025"
    ports:
      - "1433:1433"
    volumes:
      - crossledger-sql-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: crossledger-redis
    ports:
      - "6379:6379"

volumes:
  crossledger-sql-data:
